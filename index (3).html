<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日本酒タイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap">
<meta name="description" content="9つの質問で香り・コク・甘さを分析。8タイプからあなたにぴったりの日本酒を診断します。">
<meta property="og:title" content="日本酒タイプ診断">
<meta property="og:description" content="9つの質問で、8タイプからあなたにぴったりの日本酒を診断">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;z-index:10}
.overlay img{max-height:75vh;width:auto;border-radius:12px}
.overlay p{color:#fff;margin:0;font-size:14px;text-align:center}
.overlay button{background:#fff;color:#1C2733;border:0;border-radius:999px;padding:10px 24px;font:inherit;font-weight:700}
:root{
  --bg:#F4F6F5; --paper:#FFFFFF; --ink:#1C2733; --sub:#5D6B72; --line:#D9E1DE;
  --ai:#2B4C7E; --seiji:#5E9384; --seiji-soft:#E4EFEB; --on-ai:#FFFFFF; --pr:#B4553A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121A20; --paper:#1A242C; --ink:#E8EDEB; --sub:#9AA8AE; --line:#2C3942;
    --ai:#7FA3D6; --seiji:#8FC0B0; --seiji-soft:#1F2F2C; --on-ai:#10181E; --pr:#E08A70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121A20; --paper:#1A242C; --ink:#E8EDEB; --sub:#9AA8AE; --line:#2C3942;
  --ai:#7FA3D6; --seiji:#8FC0B0; --seiji-soft:#1F2F2C; --on-ai:#10181E; --pr:#E08A70;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.75;padding:0 16px}
.wrap{max-width:460px;margin:0 auto;padding-block:28px 56px}
.col{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--seiji);font-weight:700}
h1{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:900;font-size:34px;line-height:1.3;margin:0;text-wrap:balance}
h1 .accent{color:var(--ai)}
.lead{color:var(--sub);margin:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.label{font-size:12px;letter-spacing:.14em;color:var(--sub);font-weight:700;margin:0 0 8px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-chip{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--seiji-soft)}
.type-chip b{font-family:"Zen Old Mincho",serif;font-size:15px;display:block;line-height:1.3}
.type-chip i{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:14px;color:var(--sub);display:block;line-height:1.2}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.meta{display:flex;gap:16px;justify-content:center;color:var(--sub);font-size:13px}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:16px;
  background:var(--ai);color:var(--on-ai);border-radius:999px;padding:14px 20px;width:100%;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ai);border:1.5px solid var(--ai)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.opt:focus-visible,.buy:focus-visible{outline:3px solid var(--seiji);outline-offset:2px}
.progress{display:flex;gap:5px}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.progress span.on{background:var(--ai)}
.qnum{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.qtext{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:22px;line-height:1.5;margin:4px 0 0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
  background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--seiji)}
.opt.picked{border-color:var(--ai);background:var(--seiji-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt.sm{padding:11px 10px;text-align:center}
.back{align-self:flex-start;background:none;border:0;color:var(--sub);font:inherit;font-size:13px;cursor:pointer;padding:4px 0}
/* loading */
.loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.cup{width:128px;height:128px;border-radius:50%;position:relative;
  background:radial-gradient(circle,var(--paper) 0 22%,var(--ai) 22% 34%,var(--paper) 34% 50%,var(--ai) 50% 62%,var(--paper) 62%);
  box-shadow:0 0 0 1px var(--line)}
.cup::after{content:"";position:absolute;inset:-10px;border-radius:50%;
  border:4px solid transparent;border-top-color:var(--seiji);border-right-color:var(--seiji);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltext{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:18px;min-height:1.6em;margin:0}
.lbar{width:220px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.lbar span{display:block;height:100%;width:0;background:var(--ai);transition:width 5s linear}
.lpct{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;margin:0}
/* result */
.story{width:100%;max-width:100%;aspect-ratio:9/16;border-radius:16px;display:block;background:var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.15)}
.hint{font-size:12px;color:var(--sub);text-align:center;margin:0}
.toast{text-align:center;font-size:13px;color:var(--seiji);min-height:1.5em;margin:0;word-break:break-all}
.axis{display:flex;flex-direction:column;gap:12px}
.axis-row{display:grid;grid-template-columns:4.5em 1fr 4.5em;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.axis-row span:last-child{text-align:right}
.track{height:6px;border-radius:3px;background:var(--line);position:relative}
.track i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--paper)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--sub);font-size:13px}
.kv dd{margin:0}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.item .ph{width:64px;height:96px;border-radius:8px;overflow:hidden;background:var(--seiji-soft);display:flex;align-items:center;justify-content:center}
.item .ph img,.item .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.item h3{font-family:"Zen Old Mincho",serif;font-size:17px;margin:0;line-height:1.4}
.item p{margin:2px 0 8px;font-size:12.5px;color:var(--sub);line-height:1.6}
.buy{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:none;
  color:var(--on-ai);background:var(--pr);border-radius:999px;padding:6px 14px}
.prnote{font-size:11px;color:var(--sub);margin:0}
.prbadge{font-size:10px;font-weight:700;color:var(--pr);border:1px solid var(--pr);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.cup::after{animation-duration:3s}.btn,.opt,.progress span{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* ============================================================
   設定ここから（銘柄・リンク・画像はここを書き換えるだけでOK）
   link : アフィリエイトリンク。未設定なら楽天の検索ページに飛びます
   img  : 瓶の写真のURL。未設定ならイラストで表示します
   SHEET_URL : Googleスプレッドシート（Apps Script）のURL。空なら記録しません
   ============================================================ */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxNPh_pJks7h8Wq28QLROdrd-iICZJgcyng-zQSNOZYTNPeY4d9sQwo6FH8aIpLRZSa/exec";

const TYPES = {
  "fruity":  {base:"薫酒",en:"Fruity Muse",copy:"華やか香りでテンションが上がる、乾杯の女神",
    desc:"メロンやマスカットのようなフルーティな香りと、やさしい甘み。ワイングラスで香りを楽しむのがいちばん似合うタイプ。日本酒デビューにもぴったりです。",
    spec:["純米大吟醸","吟醸","生酒"],temp:"よく冷やして（10℃前後）",pair:"フルーツ、生ハム、カプレーゼ",
    c:{bg1:"#FCDDE3",bg2:"#F4AFC0",ink:"#5A2233",acc:"#DB5C7C",liq:"#FFF3CF"},vessel:"glass",motif:"petals",
    brands:[{name:"獺祭 純米大吟醸45",pref:"山口",note:"華やかな香りと上品な甘み。入門の定番"},
            {name:"紀土 純米吟醸",pref:"和歌山",note:"みずみずしい果実感。コスパも優秀"},
            {name:"鳳凰美田",pref:"栃木",note:"マスカットのような香りが魅力"}]},
  "crystal": {base:"薫酒",en:"Crystal Bloom",copy:"香りは華やか、後味はキリッ。凛とした美人タイプ",
    desc:"華やかな吟醸香は好きだけど、甘すぎるのは苦手。香りが広がったあと、すっと消えるキレのよさがあなたの好みです。",
    spec:["吟醸","大吟醸","辛口"],temp:"冷やして（8〜12℃）",pair:"白身魚のカルパッチョ、天ぷら（塩）",
    c:{bg1:"#E4E9FB",bg2:"#B9C6F0",ink:"#27305C",acc:"#6C80D8",liq:"#C7D4FF"},vessel:"glass",motif:"sparkles",
    brands:[{name:"出羽桜 桜花吟醸",pref:"山形",note:"吟醸ブームの火付け役。華やかでキレる"},
            {name:"黒龍 いっちょらい",pref:"福井",note:"穏やかな吟醸香と、すっきりした後味"},
            {name:"南部美人 特別純米",pref:"岩手",note:"果実の香りとキレのバランスが絶妙"}]},
  "honey":   {base:"熟酒",en:"Honey Queen",copy:"とろける甘さに身をゆだねる、ご褒美の女王",
    desc:"はちみつのような濃い甘みと、とろりとした口当たりが好み。食後のデザート酒として、少しずつゆっくり楽しむのがおすすめ。",
    spec:["貴醸酒","古酒","原酒"],temp:"常温、またはロックで",pair:"チーズケーキ、ドライフルーツ、ブルーチーズ",
    c:{bg1:"#FDEBBE",bg2:"#EFBE5E",ink:"#5A3A0C",acc:"#C98712",liq:"#E9A63A"},vessel:"guinomi",motif:"honey",
    brands:[{name:"華鳩 貴醸酒",pref:"広島",note:"とろりと甘い、貴醸酒の代表格"},
            {name:"新政 陽乃鳥",pref:"秋田",note:"甘酸っぱく上品な貴醸酒"},
            {name:"花陽浴",pref:"埼玉",note:"濃厚な甘みとジューシーさが人気"}]},
  "midnight":{base:"熟酒",en:"Midnight Noble",copy:"夜更けにひとり、深い余韻を愛する大人タイプ",
    desc:"ナッツやカラメルを思わせる熟成香と、深いコク。甘さより複雑な味わいに惹かれる、ちょっと通なあなたにぴったりです。",
    spec:["古酒","長期熟成酒","秘蔵酒"],temp:"常温〜ぬる燗",pair:"中華、うなぎ、ビターチョコ",
    c:{bg1:"#302C60",bg2:"#131533",ink:"#F4EAD2",acc:"#E6C274",liq:"#C9832E"},vessel:"glass",motif:"moon",
    brands:[{name:"達磨正宗",pref:"岐阜",note:"熟成古酒づくりで知られる蔵"},
            {name:"木戸泉",pref:"千葉",note:"個性的な熟成酒で根強いファン多数"}]},
  "breeze":  {base:"爽酒",en:"Soft Breeze",copy:"やさしく軽やか。どんな場面にもなじむ癒やし系",
    desc:"香りはひかえめで、口当たりはやわらか。ほんのり甘く、するっと飲める軽さが好みです。低アルコールやスパークリング日本酒も◎。",
    spec:["スパークリング","低アルコール","本醸造"],temp:"キンキンに冷やして（5℃前後）",pair:"サラダ、冷奴、フルーツ",
    c:{bg1:"#DFF4EB",bg2:"#A6DCC7",ink:"#1F4A3E",acc:"#3FA07F",liq:"#E9FBF3"},vessel:"ochoko",motif:"bubbles",
    brands:[{name:"上善如水 純米吟醸",pref:"新潟",note:"水のようにやさしい飲み口"},
            {name:"一ノ蔵 すず音",pref:"宮城",note:"甘酸っぱい発泡清酒。乾杯にも"},
            {name:"松竹梅白壁蔵 澪",pref:"兵庫",note:"手に取りやすいスパークリング"}]},
  "silver":  {base:"爽酒",en:"Silver Blade",copy:"すっきり辛口、キレ味で勝負するクールタイプ",
    desc:"香りひかえめ、すっきり淡麗で、後味はキリッと辛口。料理の味を邪魔しない、王道の食中酒タイプ。新潟の酒と相性抜群です。",
    spec:["本醸造","淡麗辛口","普通酒"],temp:"冷や〜常温",pair:"お刺身、焼き魚、枝豆",
    c:{bg1:"#E7EFF3",bg2:"#AFC4D1",ink:"#1E3444",acc:"#356A8A",liq:"#F2F8FB"},vessel:"ochoko",motif:"ripples",
    brands:[{name:"久保田 千寿",pref:"新潟",note:"淡麗辛口の代名詞"},
            {name:"八海山",pref:"新潟",note:"雪解け水のような透明感"},
            {name:"〆張鶴",pref:"新潟",note:"やわらかく品のある辛口"}]},
  "harvest": {base:"醇酒",en:"Cozy Harvest",copy:"お米の甘みでほっこり、ぬくもり系タイプ",
    desc:"炊きたてごはんのようなふくよかな香りと、まろやかな甘み。ぬる燗にすると旨みがふわっと広がって、心までほっとします。",
    spec:["純米酒","山廃","生酛"],temp:"常温〜ぬる燗（40℃前後）",pair:"おでん、肉じゃが、だし巻き卵",
    c:{bg1:"#FCE8D2",bg2:"#EFB982",ink:"#5B3316",acc:"#D0762A",liq:"#F7E3B8"},vessel:"tokkuri",motif:"rice",
    brands:[{name:"天狗舞 山廃仕込純米",pref:"石川",note:"濃醇でまろやかな山廃の名酒"},
            {name:"菊姫",pref:"石川",note:"お米の旨みがしっかり"},
            {name:"飛露喜",pref:"福島",note:"ふくよかな旨みと透明感"}]},
  "master":  {base:"醇酒",en:"Classic Master",copy:"旨みもキレも、どっしり受け止める職人肌",
    desc:"しっかりしたコクと酸、そして辛口のキレ。燗にするとさらに本領発揮。和食はもちろん、濃い味の料理とも渡り合える実力派タイプです。",
    spec:["生酛","山廃","純米"],temp:"ぬる燗〜熱燗（45〜50℃）",pair:"焼き鳥（塩）、ぶり大根、すき焼き",
    c:{bg1:"#26395F",bg2:"#131F37",ink:"#F3EADA",acc:"#E0603F",liq:"#F1E1B8"},vessel:"tokkuri",motif:"sun",
    brands:[{name:"大七 生酛",pref:"福島",note:"生酛づくりの第一人者"},
            {name:"菊正宗 生酛",pref:"兵庫",note:"キレのある辛口の定番"},
            {name:"神亀 純米",pref:"埼玉",note:"燗で化ける、骨太な純米酒"}]}
};
/* ===================== 設定ここまで ===================== */

// 3つの軸：A=香り（+華やか/-穏やか） B=コク（+濃醇/-淡麗） C=甘さ（+甘口/-辛口）
const QUESTIONS = [
  {ax:"A",q:"好きな香りのハンドクリームは？",opts:[["バラやジャスミンなど華やかな花の香り",2],["桃やマスカットなどフルーツの香り",1],["せっけん・シャボンの香り",-1],["無香料がいちばん落ち着く",-2]]},
  {ax:"B",q:"ラーメン屋さんで頼むなら？",opts:[["こってり豚骨・家系",2],["王道の醤油",1],["あっさり塩",-1],["ラーメンよりざる蕎麦派",-2]]},
  {ax:"C",q:"カフェで頼むのは？",opts:[["キャラメルマキアート",2],["カフェラテ",1],["アイスコーヒー（無糖）",-1],["ブラック一択",-2]]},
  {ax:"A",q:"おうちで飲むお茶は？",opts:[["フレーバーティー",2],["ジャスミン茶",1],["緑茶",-1],["麦茶・ほうじ茶",-2]]},
  {ax:"B",q:"晩ごはんに食べたいのは？",opts:[["すき焼き・煮込みハンバーグ",2],["唐揚げ",1],["焼き魚定食",-1],["お刺身と冷奴",-2]]},
  {ax:"C",q:"いつもの一杯は？",opts:[["梅酒・甘いカクテル",2],["フルーツサワー",1],["ハイボール",-1],["辛口の白ワイン・ドライなもの",-2]]},
  {ax:"A",q:"お部屋に飾るなら？",opts:[["香りの強いバラや百合",2],["かわいいスイートピー",1],["かすみ草",-1],["グリーンの観葉植物",-2]]},
  {ax:"B",q:"好きな口当たりは？",opts:[["とろっと濃厚なポタージュ",2],["まろやかな豆乳",1],["さらっとした麦茶",-1],["シュワっと炭酸水",-2]]},
  {ax:"C",q:"卵焼きの味つけは？",opts:[["甘〜いのが好き",2],["ほんのり甘め",1],["だし巻き",-1],["塩・しょうゆでしょっぱめ",-2]]}
];
const TYPE_BY = {"+-+":"fruity","+--":"crystal","+++":"honey","++-":"midnight","--+":"breeze","---":"silver","-++":"harvest","-+-":"master"};

const app = document.getElementById("app");
let step=-1, answers=[], resultBlob=null, profile={gender:null,age:null};

/* ---------- 画面：スタート ---------- */
function renderStart(){
  const chips=Object.values(TYPES).map(t=>`<div class="type-chip"><span class="dot" style="background:${t.c.acc}"></span><div><b>${t.base}</b><i>${t.en}</i></div></div>`).join("");
  app.innerHTML=`<div class="col fade">
    <div><div class="eyebrow">SAKE TYPE CHECK</div>
      <h1>あなたに合う<br><span class="accent">日本酒タイプ</span>診断</h1></div>
    <p class="lead">「香り」「コク」「甘さ」の3つの味覚を分析して、8つのタイプからあなたにぴったりの日本酒を見つけます。日本酒を飲んだことがなくても答えられる質問だけです。</p>
    <div class="meta"><span>全9問</span><span>約1分</span><span>全8タイプ</span></div>
    <button class="btn" id="start">診断をはじめる</button>
    <div class="panel"><p class="label">8つのタイプ</p><div class="types">${chips}</div></div>
    <p class="hint">回答内容は個人を特定しない形で集計し、今後の企画づくりに活用します。<br>by PONSHU 日本酒好きのOL ／ お酒は20歳になってから</p>
  </div>`;
  document.getElementById("start").onclick=()=>{step=0;answers=[];profile={gender:null,age:null};renderProfile();};
}

/* ---------- 画面：プロフィール（性別・年代） ---------- */
const GENDERS=["女性","男性","その他","回答しない"];
const AGES=["20代","30代","40代","50代","60代以上","回答しない"];
function renderProfile(){
  const group=(key,list)=>`<div class="grid2">${list.map((v,i)=>`<button class="opt sm${profile[key]===v?" picked":""}" id="${key}${i}" data-k="${key}" data-v="${v}">${v}</button>`).join("")}</div>`;
  app.innerHTML=`<div class="col fade" style="gap:18px">
    <div class="progress" aria-hidden="true">${QUESTIONS.map(()=>`<span></span>`).join("")}</div>
    <div><div class="qnum">はじめに</div><p class="qtext">あなたについて教えてください</p>
      <p class="lead" style="font-size:13px;margin-top:6px">統計データとしてのみ使い、個人が特定されることはありません。</p></div>
    <div><p class="label">性別</p>${group("gender",GENDERS)}</div>
    <div><p class="label">年代</p>${group("age",AGES)}</div>
    <p class="hint">この診断は20歳以上の方が対象です</p>
    <button class="btn" id="next" ${profile.gender&&profile.age?"":"disabled"}>質問にすすむ</button>
    <button class="back" id="back">← トップに戻る</button>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    profile[b.dataset.k]=b.dataset.v;
    app.querySelectorAll(`.opt[data-k="${b.dataset.k}"]`).forEach(o=>o.classList.toggle("picked",o===b));
    document.getElementById("next").disabled=!(profile.gender&&profile.age);
  });
  document.getElementById("next").onclick=()=>{step=0;renderQ();};
  document.getElementById("back").onclick=()=>{step=-1;renderStart();};
  window.scrollTo(0,0);
}

/* ---------- 画面：質問 ---------- */
function renderQ(){
  const Q=QUESTIONS[step];
  app.innerHTML=`<div class="col fade" style="gap:18px">
    <div class="progress" aria-hidden="true">${QUESTIONS.map((_,i)=>`<span class="${i<=step?"on":""}"></span>`).join("")}</div>
    <div><div class="qnum">Q${step+1} / ${QUESTIONS.length}</div><p class="qtext">${Q.q}</p></div>
    <div class="opts">${Q.opts.map((o,i)=>`<button class="opt${answers[step]===i?" picked":""}" id="opt${i}" data-i="${i}">${o[0]}</button>`).join("")}</div>
    <button class="back" id="back">← ひとつ前に戻る</button>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    answers[step]=+b.dataset.i; b.classList.add("picked");
    setTimeout(()=>{ if(step<QUESTIONS.length-1){step++;renderQ();} else renderLoading(); },180);
  });
  document.getElementById("back").onclick=()=>{ if(step>0){step--;renderQ();} else renderProfile(); };
  window.scrollTo(0,0);
}

function calc(){
  const s={A:0,B:0,C:0};
  answers.forEach((a,i)=>{s[QUESTIONS[i].ax]+=QUESTIONS[i].opts[a][1];});
  // 同点(0)のときは、初心者に合わせやすい「華やか・淡麗・甘口」側に寄せる
  const key=(s.A>=0?"+":"-")+(s.B>0?"+":"-")+(s.C>=0?"+":"-");
  return {id:TYPE_BY[key],s};
}

/* ---------- 回答をスプレッドシートに送る ---------- */
function send(data){
  if(!SHEET_URL) return;
  const body=JSON.stringify(data);
  try{ if(navigator.sendBeacon && navigator.sendBeacon(SHEET_URL,new Blob([body],{type:"text/plain"}))) return; }catch(e){}
  fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body}).catch(()=>{});
}
function logResult(res){
  const t=TYPES[res.id];
  send({kind:"result",gender:profile.gender,age:profile.age,type:t.base+" "+t.en,A:res.s.A,B:res.s.B,C:res.s.C,
        answers:answers.map((a,i)=>QUESTIONS[i].opts[a][0]),
        from:new URLSearchParams(location.search).get("from")||""});
}

/* ---------- 画面：分析中（約5秒） ---------- */
function renderLoading(){
  const res=calc();
  logResult(res);
  app.innerHTML=`<div class="loading fade">
    <div class="cup" aria-hidden="true"></div>
    <p class="ltext" id="ltext">回答を読み込んでいます…</p>
    <div class="lbar"><span id="lbar"></span></div>
    <p class="lpct" id="lpct">0%</p>
  </div>`;
  window.scrollTo(0,0);
  const msgs=["回答を読み込んでいます…","香りの好みを分析中…","コクのバランスを計算中…","甘辛度を判定中…","8つのタイプと照合中…","あなたの一本を選んでいます…"];
  const D=5000, t0=performance.now();
  requestAnimationFrame(()=>{document.getElementById("lbar").style.width="100%";});
  const timer=setInterval(()=>{
    const p=Math.min(1,(performance.now()-t0)/D);
    const lt=document.getElementById("ltext"), lp=document.getElementById("lpct");
    if(!lt){clearInterval(timer);return;}
    lt.textContent=msgs[Math.min(msgs.length-1,Math.floor(p*msgs.length))];
    lp.textContent=Math.floor(p*100)+"%";
  },100);
  const img=buildStory(res).catch(()=>null);
  Promise.all([img,new Promise(r=>setTimeout(r,D))]).then(([url])=>{clearInterval(timer);renderResult(res,url);});
}

/* ---------- ストーリー画像（1080×1920）を描く ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};}
const W=1080,H=1920,CX=540,CY=720;

async function buildStory(res){
  const t=TYPES[res.id];
  try{
    await Promise.all([
      document.fonts.load('900 150px "Zen Old Mincho"',t.base+"あなたはタイプ"),
      document.fonts.load('700 40px "Zen Old Mincho"',t.copy+"日本酒タイプ診断"),
      document.fonts.load('700 italic 76px "Cormorant Garamond"',t.en),
      document.fonts.load('500 32px "Zen Kaku Gothic New"',"香りコク甘さ華やか穏やか濃醇淡麗甘口辛口 by 日本酒好きのOL #日本酒診断")
    ]);
  }catch(e){}
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const x=cv.getContext("2d");
  const dark=res.id==="midnight"||res.id==="master";
  // 背景
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,t.c.bg1);g.addColorStop(1,t.c.bg2);
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // 和柄（青海波）をうっすら
  x.save();x.globalAlpha=dark?.07:.12;x.strokeStyle=dark?"#FFFFFF":t.c.ink;x.lineWidth=2;
  for(let row=0;row<26;row++){for(let col=-1;col<13;col++){
    const cx=col*90+(row%2?45:0), cy=row*24+1200;
    for(let r=40;r>8;r-=12){x.beginPath();x.arc(cx,cy,r,Math.PI,0);x.stroke();}
  }}
  x.restore();
  // 大きな円
  x.fillStyle=dark?"rgba(255,255,255,.07)":"rgba(255,255,255,.45)";
  x.beginPath();x.arc(CX,CY,410,0,Math.PI*2);x.fill();
  x.setLineDash([4,14]);x.strokeStyle=dark?"rgba(255,255,255,.35)":t.c.acc;x.lineWidth=3;
  x.beginPath();x.arc(CX,CY,450,0,Math.PI*2);x.stroke();x.setLineDash([]);
  // 見出し
  x.textAlign="center";x.fillStyle=t.c.ink;
  x.font='700 38px "Zen Old Mincho", serif';
  x.fillText("日 本 酒 タ イ プ 診 断",CX,150);
  // イラスト
  const R=rng(res.id.length*97+7);
  MOTIF[t.motif](x,t,R,"back");
  VESSEL[t.vessel](x,t);
  MOTIF[t.motif](x,t,R,"front");
  // タイプ名
  x.fillStyle=t.c.ink;
  x.font='500 40px "Zen Kaku Gothic New", sans-serif';x.fillText("あなたは",CX,1250);
  x.font='900 150px "Zen Old Mincho", serif';x.fillText(t.base,CX,1405);
  x.fillStyle=t.c.acc;x.font='700 italic 84px "Cormorant Garamond", Georgia, serif';x.fillText(t.en,CX,1500);
  x.fillStyle=t.c.ink;x.font='700 38px "Zen Old Mincho", serif';
  wrap(x,t.copy,CX,1580,900,54);
  // 味覚パラメータ
  const axes=[["香り","穏やか","華やか",res.s.A],["コク","淡麗","濃醇",res.s.B],["甘さ","辛口","甘口",res.s.C]];
  axes.forEach((a,i)=>{
    const y=1680+i*62, x0=330, x1=750;
    x.font='700 30px "Zen Kaku Gothic New", sans-serif';x.textAlign="right";x.fillStyle=t.c.ink;
    x.fillText(a[1],x0-24,y+10);x.textAlign="left";x.fillText(a[2],x1+24,y+10);
    x.textAlign="left";x.globalAlpha=.25;x.fillStyle=t.c.ink;roundRect(x,x0,y-4,x1-x0,8,4);x.fill();x.globalAlpha=1;
    const px=x0+(x1-x0)*((a[3]+6)/12);
    x.fillStyle=t.c.acc;x.beginPath();x.arc(px,y,17,0,Math.PI*2);x.fill();
    x.strokeStyle=dark?t.c.bg2:"#FFFFFF";x.lineWidth=5;x.stroke();
    x.textAlign="center";
  });
  x.fillStyle=t.c.ink;x.globalAlpha=.8;x.font='500 30px "Zen Kaku Gothic New", sans-serif';
  x.fillText("by PONSHU 日本酒好きのOL　#日本酒診断",CX,1880);x.globalAlpha=1;
  return new Promise(r=>cv.toBlob(b=>{resultBlob=b;r(URL.createObjectURL(b));},"image/png"));
}
function wrap(x,text,cx,y,maxW,lh){
  let line="",lines=[];
  for(const ch of text){ if(x.measureText(line+ch).width>maxW){lines.push(line);line=ch;} else line+=ch; }
  lines.push(line); lines.forEach((l,i)=>x.fillText(l,cx,y+i*lh));
}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

/* 器 */
const VESSEL={
  glass(x,t){
    const bowl=()=>{x.beginPath();x.moveTo(CX-175,420);x.bezierCurveTo(CX-190,690,CX-100,800,CX,805);x.bezierCurveTo(CX+100,800,CX+190,690,CX+175,420);x.closePath();};
    // 脚
    x.fillStyle="rgba(255,255,255,.75)";x.fillRect(CX-11,800,22,200);
    x.beginPath();x.ellipse(CX,1005,125,24,0,0,Math.PI*2);x.fill();
    // ボウル
    bowl();x.fillStyle="rgba(255,255,255,.35)";x.fill();
    x.save();bowl();x.clip();
    x.fillStyle=t.c.liq;x.globalAlpha=.9;x.fillRect(CX-200,600,400,220);
    x.globalAlpha=1;x.fillStyle="rgba(255,255,255,.6)";x.beginPath();x.ellipse(CX,600,166,20,0,0,Math.PI*2);x.fill();
    x.restore();
    bowl();x.strokeStyle="rgba(255,255,255,.95)";x.lineWidth=6;x.stroke();
    x.beginPath();x.ellipse(CX,420,175,26,0,0,Math.PI*2);x.stroke();
    // ハイライト
    x.strokeStyle="rgba(255,255,255,.9)";x.lineWidth=10;x.lineCap="round";
    x.beginPath();x.moveTo(CX-130,480);x.quadraticCurveTo(CX-140,620,CX-90,700);x.stroke();x.lineCap="butt";
  },
  ochoko(x,t){ cup(x,t,CX,760,1,true); },
  guinomi(x,t){ cup(x,t,CX,760,1,false); },
  tokkuri(x,t){
    const body=()=>{x.beginPath();x.moveTo(CX-42,380);x.lineTo(CX-42,470);
      x.bezierCurveTo(CX-60,560,CX-215,640,CX-205,820);x.bezierCurveTo(CX-200,930,CX-170,1000,CX-140,1010);
      x.lineTo(CX+140,1010);x.bezierCurveTo(CX+170,1000,CX+200,930,CX+205,820);
      x.bezierCurveTo(CX+215,640,CX+60,560,CX+42,470);x.lineTo(CX+42,380);x.closePath();};
    body();x.fillStyle="#FBF7EE";x.fill();
    // 釉薬の掛け分け
    x.save();body();x.clip();x.fillStyle=t.c.acc;x.globalAlpha=.85;
    x.beginPath();x.moveTo(CX-260,760);x.bezierCurveTo(CX-100,720,CX+100,800,CX+260,740);x.lineTo(CX+260,1100);x.lineTo(CX-260,1100);x.closePath();x.fill();
    x.restore();
    body();x.strokeStyle=t.c.ink;x.globalAlpha=.35;x.lineWidth=5;x.stroke();x.globalAlpha=1;
    x.fillStyle="#FBF7EE";x.beginPath();x.ellipse(CX,380,58,16,0,0,Math.PI*2);x.fill();
    x.strokeStyle=t.c.ink;x.globalAlpha=.35;x.stroke();x.globalAlpha=1;
    x.strokeStyle="rgba(255,255,255,.8)";x.lineWidth=12;x.lineCap="round";
    x.beginPath();x.moveTo(CX-150,700);x.quadraticCurveTo(CX-175,800,CX-150,900);x.stroke();x.lineCap="butt";
    cup(x,t,CX+265,960,.42,true);
  }
};
function cup(x,t,cx,top,s,janome){
  const rx=240*s, ry=62*s, h=250*s;
  x.save();
  const body=()=>{x.beginPath();x.moveTo(cx-rx,top);x.bezierCurveTo(cx-rx,top+h*.7,cx-rx*.62,top+h,cx-rx*.55,top+h);
    x.lineTo(cx+rx*.55,top+h);x.bezierCurveTo(cx+rx*.62,top+h,cx+rx,top+h*.7,cx+rx,top);x.closePath();};
  // 高台
  x.fillStyle=janome?"#FFFFFF":t.c.acc;x.fillRect(cx-rx*.4,top+h-4,rx*.8,34*s);
  body();x.fillStyle=janome?"#FFFFFF":t.c.acc;x.fill();
  if(!janome){x.save();body();x.clip();x.fillStyle="rgba(255,255,255,.25)";
    x.beginPath();x.moveTo(cx-rx,top+h*.35);x.bezierCurveTo(cx-rx*.3,top+h*.55,cx+rx*.3,top+h*.2,cx+rx,top+h*.45);x.lineTo(cx+rx,top);x.lineTo(cx-rx,top);x.fill();x.restore();}
  x.strokeStyle="rgba(0,0,0,.12)";x.lineWidth=4*s;body();x.stroke();
  // 口と中身
  x.beginPath();x.ellipse(cx,top,rx,ry,0,0,Math.PI*2);x.fillStyle="#FFFFFF";x.fill();
  if(janome){ // 蛇の目
    x.fillStyle="#2A4E9A";x.beginPath();x.ellipse(cx,top+6*s,rx*.7,ry*.7,0,0,Math.PI*2);x.fill();
    x.fillStyle="#FFFFFF";x.beginPath();x.ellipse(cx,top+6*s,rx*.5,ry*.5,0,0,Math.PI*2);x.fill();
    x.fillStyle="#2A4E9A";x.beginPath();x.ellipse(cx,top+6*s,rx*.28,ry*.28,0,0,Math.PI*2);x.fill();
    x.fillStyle="rgba(210,235,245,.35)";
  }else{x.fillStyle=t.c.liq;}
  x.beginPath();x.ellipse(cx,top+4*s,rx*.9,ry*.82,0,0,Math.PI*2);x.fill();
  x.strokeStyle="rgba(0,0,0,.12)";x.lineWidth=4*s;x.beginPath();x.ellipse(cx,top,rx,ry,0,0,Math.PI*2);x.stroke();
  x.restore();
}

/* 飾り */
function star4(x,cx,cy,r){x.beginPath();x.moveTo(cx,cy-r);x.quadraticCurveTo(cx,cy,cx+r,cy);x.quadraticCurveTo(cx,cy,cx,cy+r);x.quadraticCurveTo(cx,cy,cx-r,cy);x.quadraticCurveTo(cx,cy,cx,cy-r);x.fill();}
function around(R,minR,maxR){const a=R()*Math.PI*2, d=minR+R()*(maxR-minR);return [CX+Math.cos(a)*d,CY+Math.sin(a)*d*1.05];}
const MOTIF={
  petals(x,t,R,layer){

    for(let i=0;i<n;i++){const[px,py]=around(R,layer==="back"?260:330,470);
      x.save();x.translate(px,py);x.rotate(R()*Math.PI);x.fillStyle=i%3?"#FFFFFF":t.c.acc;x.globalAlpha=.85;

      x.fillStyle="#7DBB6E";x.beginPath();x.ellipse(820,350,34,16,-.5,0,Math.PI*2);x.fill();
      x.fillStyle="#F2A33A";x.beginPath();x.arc(290,930,46,0,Math.PI*2);x.fill();
      x.fillStyle="#7DBB6E";x.beginPath();x.ellipse(305,880,24,11,.6,0,Math.PI*2);x.fill();
    }
  },
  sparkles(x,t,R,layer){
    const n=layer==="back"?12:9;
    for(let i=0;i<n;i++){const[px,py]=around(R,layer==="back"?240:320,480);
      x.fillStyle=i%2?"#FFFFFF":t.c.acc;star4(x,px,py,12+R()*28);}
  },
  honey(x,t,R,layer){
    if(layer==="back"){ // 王冠
      x.fillStyle=t.c.acc;x.beginPath();
      x.moveTo(CX-130,560);x.lineTo(CX-150,400);x.lineTo(CX-70,480);x.lineTo(CX,370);x.lineTo(CX+70,480);x.lineTo(CX+150,400);x.lineTo(CX+130,560);x.closePath();x.fill();
      x.fillStyle="#FFF4D6";[[-150,400],[0,370],[150,400]].forEach(([dx,dy])=>{x.beginPath();x.arc(CX+dx,dy,16,0,Math.PI*2);x.fill();});

      x.bezierCurveTo(px+s,py-s*.2,px+s,py+s,px,py+s);x.bezierCurveTo(px-s,py+s,px-s,py-s*.2,px,py-s*1.6);x.fill();}
  },
  moon(x,t,R,layer){

      x.fillStyle=t.c.acc;x.beginPath();x.arc(CX+190,350,95,0,Math.PI*2);x.fill();
      x.fillStyle=t.c.bg1;x.beginPath();x.arc(CX+235,320,85,0,Math.PI*2);x.fill();
    }
    const n=layer==="back"?16:8;
    for(let i=0;i<n;i++){const[px,py]=around(R,200,480);x.fillStyle=i%3?"#FFFFFF":t.c.acc;x.globalAlpha=.9;star4(x,px,py,6+R()*16);x.globalAlpha=1;}
  },
  bubbles(x,t,R,layer){

    for(let i=0;i<n;i++){const[px,py]=layer==="back"?around(R,260,470):[CX-160+R()*320,360+R()*360];const r=8+R()*(layer==="back"?34:18);
      x.strokeStyle="#FFFFFF";x.lineWidth=5;x.globalAlpha=.9;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.stroke();x.globalAlpha=1;}
    if(layer==="back"){x.strokeStyle=t.c.acc;x.lineWidth=7;x.lineCap="round";
      [[200,470],[700,330],[760,980]].forEach(([a,b])=>{x.beginPath();x.moveTo(a,b);x.bezierCurveTo(a+60,b-40,a+120,b+40,a+180,b);x.stroke();});x.lineCap="butt";}
  },
  ripples(x,t,R,layer){
    if(layer==="back"){
      x.strokeStyle="#FFFFFF";x.lineWidth=5;
      for(let r=1;r<=4;r++){x.globalAlpha=1-r*.18;x.beginPath();x.ellipse(CX,1040,150+r*70,26+r*16,0,0,Math.PI*2);x.stroke();}
      x.globalAlpha=1;x.strokeStyle=t.c.acc;x.lineWidth=6;x.lineCap="round";
      [[180,380,420],[640,300,300],[160,560,260],[720,470,200]].forEach(([a,b,w])=>{x.beginPath();x.moveTo(a,b);x.lineTo(a+w,b-70);x.stroke();});
      x.lineCap="butt";
    }else{
      x.fillStyle="#FFFFFF";[[CX-40,560,22],[CX+10,500,14],[CX-10,450,9]].forEach(([a,b,r])=>{x.beginPath();x.moveTo(a,b-r*1.6);x.bezierCurveTo(a+r,b-r*.2,a+r,b+r,a,b+r);x.bezierCurveTo(a-r,b+r,a-r,b-r*.2,a,b-r*1.6);x.fill();});
    }
  },
  rice(x,t,R,layer){
    if(layer==="back"){
      [[250,1000,-.35],[830,1000,.35]].forEach(([bx,by,rot])=>{
        x.save();x.translate(bx,by);x.rotate(rot);
        x.strokeStyle="#B88A3C";x.lineWidth=6;x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(10,-250,rot<0?60:-60,-460);x.stroke();
        for(let i=0;i<9;i++){const yy=-180-i*30, xx=(rot<0?1:-1)*i*6;
          x.fillStyle="#E8B94A";x.beginPath();x.ellipse(xx-18,yy,11,20,-.5,0,Math.PI*2);x.fill();x.beginPath();x.ellipse(xx+18,yy,11,20,.5,0,Math.PI*2);x.fill();}
        x.restore();});
    }else steam(x,t,[CX-40,CX+30],340);
  },
  sun(x,t,R,layer){
    if(layer==="back"){
      x.fillStyle=t.c.acc;x.beginPath();x.arc(CX-170,420,120,0,Math.PI*2);x.fill();
      x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=4;
      for(let i=0;i<5;i++){x.beginPath();x.moveTo(170,1040-i*24);x.lineTo(910,1040-i*24);x.stroke();}
    }else steam(x,t,[CX-40,CX+30],340);
  }
};
function steam(x,t,xs,y){
  x.strokeStyle="#FFFFFF";x.lineWidth=8;x.lineCap="round";x.globalAlpha=.9;
  xs.forEach(sx=>{x.beginPath();x.moveTo(sx,y);x.bezierCurveTo(sx-26,y-30,sx+26,y-50,sx,y-80);x.bezierCurveTo(sx-26,y-110,sx+26,y-125,sx,y-150);x.stroke();});
  x.globalAlpha=1;x.lineCap="butt";
}

/* ---------- 瓶のイラスト（写真がないとき） ---------- */
function bottleSVG(name,color){
  const ch=name.trim()[0];
  return `<svg viewBox="0 0 64 96" aria-hidden="true"><rect width="64" height="96" fill="${color}" opacity=".18"/>
  <path d="M27 8h10v14c0 4 9 8 9 18v46a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V40c0-10 9-14 9-18z" fill="${color}"/>
  <rect x="26" y="5" width="12" height="6" rx="1.5" fill="${color}" opacity=".7"/>
  <rect x="21" y="48" width="22" height="30" rx="2" fill="#FFFDF7"/>
  <text x="32" y="69" text-anchor="middle" font-size="16" font-weight="700" fill="${color}" font-family="Zen Old Mincho,serif">${ch}</text></svg>`;
}

/* ---------- 画面：結果 ---------- */
function renderResult(res,imgUrl){
  const t=TYPES[res.id];
  const axis=[["穏やか","華やか",res.s.A],["淡麗","濃醇",res.s.B],["辛口","甘口",res.s.C]]
    .map(a=>`<div class="axis-row"><span>${a[0]}</span><div class="track"><i style="left:${(a[2]+6)/12*100}%;background:${t.c.acc}"></i></div><span>${a[1]}</span></div>`).join("");
  const items=t.brands.map(b=>{
    const link=b.link||("https://search.rakuten.co.jp/search/mall/"+encodeURIComponent(b.name)+"/");
    const ph=b.img?`<img src="${b.img}" alt="${b.name}">`:bottleSVG(b.name,t.c.acc);
    return `<div class="item"><div class="ph">${ph}</div><div>
      <h3>${b.name}</h3><p>${b.pref}｜${b.note}</p>
      <a class="buy" href="${link}" target="_blank" rel="noopener sponsored" data-brand="${b.name}">楽天で見る<span aria-hidden="true">›</span></a></div></div>`;}).join("");
  app.innerHTML=`<div class="col fade">
    <div class="eyebrow" style="text-align:center">診断結果</div>
    ${imgUrl?`<img class="story" id="story" src="${imgUrl}" alt="${t.base} ${t.en}：${t.copy}">`:`<div class="panel"><p class="rname">${t.base} ${t.en}</p></div>`}
    <div class="col" style="gap:8px">
      <button class="btn" id="save">画像を保存してストーリーズでシェア</button>
      <p class="toast" id="toast" aria-live="polite"></p>
      <p class="hint">うまくいかないときは、上の画像を長押しして保存できます</p>
    </div>
    <div class="panel col" style="gap:18px">
      <div><p class="label">あなたのタイプ</p>
        <p style="margin:0;font-family:'Zen Old Mincho',serif;font-weight:900;font-size:28px;line-height:1.3">${t.base}<span style="font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:${t.c.acc};margin-left:10px">${t.en}</span></p>
        <p style="margin:4px 0 0;font-weight:700">${t.copy}</p></div>
      <p style="margin:0">${t.desc}</p>
      <div><p class="label">あなたの味覚バランス</p><div class="axis">${axis}</div></div>
      <div><p class="label">ラベルでここをチェック</p><div class="tags">${t.spec.map(s=>`<span class="tag">${s}</span>`).join("")}</div></div>
      <dl class="kv"><dt>飲み頃</dt><dd>${t.temp}</dd><dt>合うおつまみ</dt><dd>${t.pair}</dd></dl>
    </div>
    <div class="col" style="gap:10px">
      <p class="label" style="margin:0">あなたにおすすめの日本酒<span class="prbadge">PR</span></p>
      <div class="items">${items}</div>
      <p class="prnote">※リンクはアフィリエイトリンクを含みます。お酒は20歳になってから。</p>
    </div>
    <button class="btn ghost" id="copy">シェア用の文章をコピー</button>
    <button class="btn ghost" id="retry">もう一度診断する</button>
  </div>`;
  window.scrollTo(0,0);
  app.querySelectorAll(".buy").forEach(a=>a.addEventListener("click",()=>send({kind:"click",type:t.base+" "+t.en,brand:a.dataset.brand})));
  const toast=document.getElementById("toast");
  const saveBtn=document.getElementById("save");
  if(!resultBlob) saveBtn.hidden=true;
  const fname=`日本酒タイプ診断_${t.base}.png`;
  saveBtn.onclick=async()=>{
    const file=new File([resultBlob],fname,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});toast.textContent="ストーリーズに載せてね";send({kind:"share",type:t.base+" "+t.en});return;}
      catch(e){if(e&&e.name==="AbortError")return;}
    }
    showOverlay(imgUrl);
  };
  const share=`日本酒タイプ診断の結果は【${t.base} ${t.en}】でした🍶\n${t.copy}\n#日本酒 #日本酒診断 #日本酒女子 #日本酒初心者`;
  document.getElementById("copy").onclick=()=>{
    const ok=()=>toast.textContent="コピーしました。インスタに貼り付けてね";
    const ng=()=>toast.textContent="コピーできませんでした。こちらを長押しでコピー："+share;
    try{navigator.clipboard.writeText(share).then(ok,ng);}catch(e){ng();}
    saveBtn.scrollIntoView({behavior:"smooth",block:"center"});
  };
  document.getElementById("retry").onclick=()=>{step=-1;resultBlob=null;renderStart();window.scrollTo(0,0);};
}

function showOverlay(url){
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<img src="${url}" alt="診断結果の画像"><p>画像を長押しして「写真に保存」を選んでね</p><button type="button">閉じる</button>`;
  ov.querySelector("button").onclick=()=>ov.remove();
  document.body.appendChild(ov);
}

renderStart();
</script>
